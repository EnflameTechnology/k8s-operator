apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: enflame-gcu-driver
  namespace: kube-system
  labels:
     app.kubernetes.io/name: enflame-gcu-driver
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: enflame-gcu-driver
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
         app.kubernetes.io/name: enflame-gcu-driver
    spec:
      serviceAccountName: enflame-gcu-driver
      tolerations:
        - effect: NoSchedule
          operator: Exists
          key: node-role.kubernetes.io/master
        - effect: NoSchedule
          operator: Exists
          key: node-role.kubernetes.io/control-plane
      containers:
        - name: enflame-gcu-driver
          image: artifact.enflame.cn/enflame_docker_images/enflame/gcu-driver:default
          imagePullPolicy: IfNotPresent
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: LOGPATH
            value: /var/log/enflame/gcu-operator/gcu-driver.log
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/driverCheckFlag.log
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["rm", "-fr", "/tmp/driverCheckFlag.log"]
          volumeMounts:
            - name: usr-src
              mountPath: /usr/src
            - name: lib-modules
              mountPath: /lib/modules
            - name: sys
              mountPath: /sys
            - name: usr-bin
              mountPath: /usr/bin
            - name: usr-local
              mountPath: /usr/local
            - name: usr-lib
              mountPath: /usr/lib
            - name: dev
              mountPath: /dev
            - name: var-run
              mountPath: /var/run
            - name: etc-localtime
              mountPath: /etc/localtime
              readOnly: True
            - name: lib-firmware
              mountPath: /lib/firmware
            - name: log-path
              mountPath: /var/log/enflame/gcu-operator/gcu-driver.log
      volumes:
        - name: usr-src
          hostPath:
            path: /usr/src
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: sys
          hostPath:
            path: /sys
        - name: usr-bin
          hostPath:
            path: /usr/bin
        - name: usr-local
          hostPath:
            path: /usr/local
        - name: usr-lib
          hostPath:
            path: /usr/lib
        - name: dev
          hostPath:
            path: /dev
        - name: var-run
          hostPath:
            path: /var/run/
        - name: etc-localtime
          hostPath:
            path: /etc/localtime
        - name: lib-firmware
          hostPath:
            path: /lib/firmware
        - name: log-path
          hostPath:
            path: /var/log/enflame/gcu-operator/gcu-driver.log
            type: FileOrCreate
