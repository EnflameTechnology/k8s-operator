apiVersion: v1
kind: Service
metadata:
  labels:
    app: node-exporter-ds
  name: node-exporter-service
  namespace: kube-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9100"
spec:
  selector:
    name: node-exporter-ds
  ports:
    - port: 9100
      targetPort: 9100
  type: NodePort