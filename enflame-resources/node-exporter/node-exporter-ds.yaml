apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: node-exporter-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: node-exporter-ds
    spec:
      hostNetwork: true
      tolerations:
        - effect: NoSchedule
          operator: Exists
          key: node-role.kubernetes.io/master
        - effect: NoSchedule
          operator: Exists
          key: node-role.kubernetes.io/control-plane
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          imagePullPolicy: IfNotPresent #Always
          securityContext:
            privileged: true
          ports:
            - name: exporterport
              protocol: TCP
              containerPort: 9100
              hostPort: 9100
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 2000Mi
              cpu: 2000m
          volumeMounts:
            - name: syspath
              mountPath: /sys
      volumes:
        - name: syspath
          hostPath:
            path: /sys