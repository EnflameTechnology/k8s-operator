# permissions for end users to view gcuresources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gcuresource-viewer-role
rules:
- apiGroups:
  - topscloud.enflame.com
  resources:
  - gcuresources
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - topscloud.enflame.com
  resources:
  - gcuresources/status
  verbs:
  - get
